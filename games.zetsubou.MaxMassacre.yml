app-id: games.zetsubou.MaxMassacre
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: MaxMassacre.sh
tags:
  - proprietary
finish-args:
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --socket=pulseaudio
  - --persist=.renpy
modules:
  - name: hmp
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin/
      - cp -R * /app/bin/
      - install -Dm644 -t "/app/share/metainfo/" games.zetsubou.MaxMassacre.metainfo.xml
      - install -Dm644 -t "/app/share/applications/" games.zetsubou.MaxMassacre.desktop
      - install -Dm644 games.zetsubou.MaxMassacre.png "/app/share/icons/hicolor/512x512/apps/games.zetsubou.MaxMassacre.png"
    sources:
      - type: archive
        url: https://gitlab.com/zetsubougames-builds/max-massacre/-/releases/v2.0.1/downloads/max-massacre-linux-amd64.zip
        sha512: 4fe53c79da5925a9b5b91024646bc7d5790bd32e9e30512c94c3d268a25803f74abef8f15c84c8e52313f93ca4828b5cd1cca309d1255e64774d9d7375ed61ca
        only-arches:
          - x86_64
      - type: archive
        url: https://gitlab.com/zetsubougames-builds/max-massacre/-/releases/v2.0.1/downloads/max-massacre-linux-aarch64.zip
        sha512: 462b0c7c3ec638f7581bd1bb9105ca647ad49a9566fc3628f7b6e7595fe26cb86264e9c30aa3990fdd2318acb1c5ad161e4b8179a32c09e4c4434376bd1ac232
        only-arches:
          - aarch64
